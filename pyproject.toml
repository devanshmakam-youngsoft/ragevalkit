[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ragevalkit"
version = "0.1.0"
description = "A generic RAG / LLM evaluation toolkit with a React dashboard"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Youngsoft" }]
keywords = ["rag", "llm", "evaluation", "benchmark", "chatbot", "ai"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "tinydb>=4.8",
    "litellm>=1.43",
    "pandas>=2.2",
    "openpyxl>=3.1",
    "sentence-transformers>=3.0",
]

[project.optional-dependencies]
dev = ["pytest", "httpx", "pytest-asyncio", "ruff"]

[project.urls]
Repository = "https://github.com/devanshmakam-youngsoft/ragevalkit"

[tool.setuptools.packages.find]
where = ["."]
include = ["ragevalkit*"]

[tool.setuptools.package-data]
ragevalkit = ["static/**/*", "static/*", "py.typed"]

[tool.ruff]
line-length = 100
target-version = "py310"
